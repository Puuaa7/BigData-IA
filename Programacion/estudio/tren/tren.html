<title>Python en el tren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: una columna estrecha pensada para el pulgar; la portada es una línea de tren con un examen por estación */
  :root {
    --bg: #eef2f5;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5b6878;
    --line: #d3dbe3;
    --accent: #2b67b0;
    --accent-ink: #ffffff;
    --yellow: #f2c230;
    --ok: #1f8a4c;
    --ok-bg: #e3f4ea;
    --bad: #c23b32;
    --bad-bg: #fbe7e5;
    --code-bg: #1d2530;
    --code-ink: #e4e9ef;
    --k: #7fb2f0;
    --s: #f2c86b;
    --n: #f29b74;
    --b: #8fd6b4;
    --c: #7d8b9b;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b; --surface: #19212b; --ink: #e8edf2; --muted: #93a1b0; --line: #2c3743;
      --accent: #6fa3e6; --accent-ink: #0d1520; --yellow: #f2c230;
      --ok: #5fd08f; --ok-bg: #173325; --bad: #f07b72; --bad-bg: #3a1c1a;
      --code-bg: #0b0f14; --code-ink: #e4e9ef;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b; --surface: #19212b; --ink: #e8edf2; --muted: #93a1b0; --line: #2c3743;
    --accent: #6fa3e6; --accent-ink: #0d1520; --yellow: #f2c230;
    --ok: #5fd08f; --ok-bg: #173325; --bad: #f07b72; --bad-bg: #3a1c1a;
    --code-bg: #0b0f14; --code-ink: #e4e9ef;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 120px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Portada ---------- */
  .eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 800 clamp(32px, 9vw, 44px)/1.02 var(--display); margin: 8px 0 6px; letter-spacing: -.02em; text-wrap: balance; }
  h1 .py { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 34ch; }

  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .quick button {
    text-align: left; border: 0; border-radius: 14px; padding: 14px;
    display: grid; gap: 2px; min-height: 76px;
  }
  .quick .rnd { background: var(--accent); color: var(--accent-ink); }
  .quick .rev { background: var(--surface); border: 1.5px solid var(--line); }
  .quick .rev[disabled] { opacity: .55; cursor: default; }
  .quick b { font: 700 17px/1.2 var(--display); }
  .quick span { font-size: 13px; opacity: .85; }

  .linea-tit { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .linea-tit h2 { font: 700 18px/1 var(--display); margin: 0; }
  .linea-tit small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .linea { list-style: none; margin: 0; padding: 0; position: relative; }
  .linea::before {
    content: ""; position: absolute; left: 15px; top: 26px; bottom: 26px; width: 6px;
    background: var(--accent); border-radius: 3px; opacity: .9;
  }
  .estacion button {
    width: 100%; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
    background: none; border: 0; padding: 10px 0; text-align: left;
  }
  .dot {
    width: 36px; height: 36px; border-radius: 50%; position: relative; z-index: 1;
    background: var(--surface); border: 5px solid var(--accent);
    display: grid; place-items: center;
  }
  .estacion.hecha .dot { background: var(--yellow); }
  .estacion.hecha .dot::after { content: ""; width: 9px; height: 5px; border: solid #17202b; border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
  .est-txt { min-width: 0; }
  .est-txt b { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; }
  .est-txt span { font-size: 13px; color: var(--muted); }
  .nota {
    font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums;
    padding: 6px 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .nota.buena { color: var(--ok); border-color: currentColor; }
  .pie { color: var(--muted); font-size: 13px; margin-top: 24px; }
  .pie button { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: 13px; }

  /* ---------- Examen ---------- */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    padding-block: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  }
  .salir { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .barra { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s; }
  .cuenta { font: 600 14px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  .tipo { font: 600 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 14px 0 6px; }
  .enunciado { font: 600 19px/1.35 var(--body); margin: 0 0 12px; text-wrap: pretty; }
  pre.code {
    background: var(--code-bg); color: var(--code-ink); border-radius: 12px;
    padding: 14px 16px; margin: 0 0 16px; overflow-x: auto;
    font: 14.5px/1.55 var(--mono); tab-size: 4;
  }
  .tk-k { color: var(--k); } .tk-s { color: var(--s); } .tk-n { color: var(--n); } .tk-b { color: var(--b); } .tk-c { color: var(--c); font-style: italic; }
  .hueco { background: var(--yellow); color: #17202b; border-radius: 4px; padding: 0 4px; font-weight: 600; }

  .opciones { display: grid; gap: 10px; }
  .op {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
    text-align: left; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 12px; min-height: 52px;
  }
  .op .letra { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 600 13px/1 var(--mono); background: var(--bg); color: var(--muted); }
  .op .txt { min-width: 0; white-space: pre-wrap; word-break: break-word; padding-top: 2px; }
  .op.mono .txt { font: 14.5px/1.45 var(--mono); }
  .op:not([disabled]):active { transform: scale(.985); }
  .op[disabled] { cursor: default; }
  .op.ok { border-color: var(--ok); background: var(--ok-bg); }
  .op.ok .letra { background: var(--ok); color: var(--surface); }
  .op.mal { border-color: var(--bad); background: var(--bad-bg); }
  .op.mal .letra { background: var(--bad); color: var(--surface); }
  .op.apagada { opacity: .5; }

  .explica { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .explica b { display: block; margin-bottom: 2px; }
  .explica.ok b { color: var(--ok); } .explica.mal b { color: var(--bad); }
  .explica .pq { display: block; white-space: pre-line; margin-bottom: 10px; }
  .explica.mal b.bien-tit { color: var(--ok); }
  .opc { font-family: var(--mono); font-size: .92em; background: var(--bg); padding: 1px 5px; border-radius: 5px; }

  .accion {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding-top: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .accion button {
    display: block; width: 100%; max-width: 560px; margin: 0 auto;
    border: 0; border-radius: 14px; padding: 15px; font: 700 17px/1 var(--display);
    background: var(--accent); color: var(--accent-ink);
  }

  /* ---------- Resultado ---------- */
  .marcador { text-align: center; padding: 24px 0 8px; }
  .marcador .grande { font: 800 72px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .marcador .grande small { font-size: 32px; color: var(--muted); }
  .marcador p { margin: 6px 0 0; color: var(--muted); }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 26px; }
  .botones button { border-radius: 12px; padding: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); }
  .botones button.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .fallo { border-top: 1px solid var(--line); padding: 16px 0; }
  .fallo .enunciado { font-size: 16px; margin-bottom: 8px; }
  .fallo pre.code { font-size: 13.5px; margin-bottom: 10px; }
  .resp { font-size: 14px; display: grid; gap: 4px; }
  .resp code { font-family: var(--mono); white-space: pre-wrap; }
  .resp .tu { color: var(--bad); } .resp .bien { color: var(--ok); }
  .resp .por { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .op:active { transform: none !important; } }
</style>

<main class="wrap" id="app"></main>

<script>
const EXAMENES = [{"id": "tipos", "titulo": "Tipos y operadores", "tema": "Tema 1", "preguntas": [{"id": "tipos-1", "t": "out", "q": "", "code": "print(7 // 2, 7 % 2)", "opts": ["3 1", "3.5 1", "3 1.0", "4 1"], "a": 0, "exp": "// es división entera (3) y % es el resto (1).", "expect": null, "por": {"3.5 1": "3.5 sería con /. // es división entera y quita los decimales.", "3 1.0": "Con dos int, % devuelve int: 1, no 1.0.", "4 1": "// no redondea al más cercano: se queda con la parte entera (3)."}}, {"id": "tipos-2", "t": "out", "q": "", "code": "print(10 / 2)", "opts": ["5.0", "5", "5.00", "Error"], "a": 0, "exp": "/ siempre devuelve float, aunque la división sea exacta.", "expect": null, "por": {"5": "/ siempre da float aunque sea exacta. Para obtener 5 usarías //.", "5.00": "print no añade ceros: un float exacto se muestra como 5.0.", "Error": "Dividir dos int es válido."}}, {"id": "tipos-3", "t": "out", "q": "", "code": "print(17 % 5, 2 ** 4)", "opts": ["2 16", "3 16", "2 8", "3.4 16"], "a": 0, "exp": "17 entre 5 cabe 3 veces y sobran 2. 2 ** 4 = 16.", "expect": null, "por": {"3 16": "3 es el cociente (17 // 5). % da el RESTO: 2.", "2 8": "2 ** 4 = 2·2·2·2 = 16. El 8 sería 2 ** 3.", "3.4 16": "3.4 sería 17 / 5. % da el resto."}}, {"id": "tipos-4", "t": "out", "q": "", "code": "x = \"3\"\nprint(x * 3)", "opts": ["333", "9", "3 3 3", "Error"], "a": 0, "exp": "Un str multiplicado por un int repite el texto.", "expect": null, "por": {"9": "x es el texto \"3\", no el número 3. str * int repite el texto.", "3 3 3": "Repetir un texto no añade espacios.", "Error": "str * int es válido (repite). Lo que da error es str + int."}}, {"id": "tipos-5", "t": "err", "q": "", "code": "print(\"Edad: \" + 20)", "opts": ["TypeError", "SyntaxError", "NameError", "Ningún error"], "a": 0, "exp": "No se puede sumar str + int. Usa str(20), comas en print o un f-string.", "expect": null, "por": {"SyntaxError": "SyntaxError sale cuando el código está mal escrito (falta :, = en vez de ==, …) y Python ni lo ejecuta. Aquí no pasa eso.", "NameError": "NameError sale cuando se usa una variable que no existe o está mal escrita. Aquí no pasa eso.", "Ningún error": "Sí hay error: TypeError."}}, {"id": "tipos-6", "t": "out", "q": "", "code": "print(type(6 / 3))", "opts": ["<class 'float'>", "<class 'int'>", "2.0", "<class 'str'>"], "a": 0, "exp": "6 / 3 da 2.0, que es float.", "expect": null, "por": {"<class 'int'>": "/ siempre devuelve float, aunque el resultado sea exacto.", "2.0": "Se imprime el TIPO del resultado, no el resultado.", "<class 'str'>": "Es una división de números; no hay texto."}}, {"id": "tipos-7", "t": "out", "q": "", "code": "a = 5\na += 3\na *= 2\nprint(a)", "opts": ["16", "13", "10", "11"], "a": 0, "exp": "a pasa a 8 y luego a 16.", "expect": null, "por": {"13": "Van en orden: primero a = 8 y luego 8 * 2 = 16.", "10": "a += 3 se hace antes de multiplicar: 8 * 2.", "11": "*= multiplica, no suma."}}, {"id": "tipos-8", "t": "out", "q": "", "code": "print(5 > 3 and 2 > 4, not False)", "opts": ["False True", "True True", "True False", "False False"], "a": 0, "exp": "and necesita que las dos sean True; 2 > 4 es False. not False es True.", "expect": null, "por": {"True True": "and necesita las dos, y 2 > 4 es False.", "True False": "5 > 3 and 2 > 4 da False. not False da True.", "False False": "not False es True."}}, {"id": "tipos-9", "t": "mc", "q": "¿Qué representa None en Python?", "code": "", "opts": ["La ausencia de valor", "El número 0", "Un texto vacío", "El valor False"], "a": 0, "exp": "0, \"\" y False son valores. None significa que no hay valor.", "expect": null, "por": {"El número 0": "0 es un número: hay valor, y es cero.", "Un texto vacío": "\"\" es un texto que existe aunque esté vacío.", "El valor False": "False es un booleano. None no es ni True ni False."}}, {"id": "tipos-10", "t": "out", "q": "", "code": "print(int(\"7\") + 3, str(7) + \"3\")", "opts": ["10 73", "73 10", "10 10", "73 73"], "a": 0, "exp": "int(\"7\") + 3 es una suma de números (10). str(7) + \"3\" une textos (\"73\").", "expect": null, "por": {"73 10": "print respeta el orden: primero va int(\"7\") + 3, que es 10.", "10 10": "str(7) + \"3\" une textos: \"73\".", "73 73": "int(\"7\") lo convierte a número, así que + suma: 10."}}]}, {"id": "compuestos", "titulo": "Listas, tuplas, dicts y sets", "tema": "Tema 2", "preguntas": [{"id": "compuestos-1", "t": "out", "q": "", "code": "l = [4, 8, 15, 16]\nprint(l[1], l[-1])", "opts": ["8 16", "4 16", "8 15", "4 15"], "a": 0, "exp": "El índice empieza en 0, así que l[1] es 8. l[-1] es el último.", "expect": null, "por": {"4 16": "Los índices empiezan en 0: l[0] es 4 y l[1] es 8.", "8 15": "l[-1] es el ÚLTIMO elemento: 16.", "4 15": "l[1] es el segundo (8) y l[-1] el último (16)."}}, {"id": "compuestos-2", "t": "out", "q": "", "code": "l = [1, 2, 3]\nl.append([4, 5])\nprint(len(l))", "opts": ["4", "5", "3", "Error"], "a": 0, "exp": "append añade UN elemento: la lista [4, 5] entera cuenta como uno.", "expect": null, "por": {"5": "append añade UN elemento: la lista [4, 5] entera. Para añadir 4 y 5 sueltos harían falta dos append.", "3": "append sí modifica la lista: tiene un elemento más.", "Error": "Una lista puede contener otra lista."}}, {"id": "compuestos-3", "t": "err", "q": "", "code": "t = (1, 2)\nt[0] = 5", "opts": ["TypeError", "IndexError", "KeyError", "Ningún error"], "a": 0, "exp": "Las tuplas son inmutables: no se pueden modificar.", "expect": null, "por": {"IndexError": "IndexError sale cuando se accede a una posición de lista/tupla que no existe. Aquí no pasa eso.", "KeyError": "KeyError sale cuando se busca una clave que no está en un diccionario. Aquí no pasa eso.", "Ningún error": "Sí hay error: TypeError."}}, {"id": "compuestos-4", "t": "out", "q": "", "code": "d = {\"a\": 1, \"b\": 2}\nd[\"c\"] = 3\nd[\"a\"] = 0\nprint(d)", "opts": ["{'a': 0, 'b': 2, 'c': 3}", "{'a': 1, 'b': 2, 'c': 3}", "{'b': 2, 'c': 3, 'a': 0}", "Error"], "a": 0, "exp": "Si la clave existe se modifica; si no existe, se añade al final.", "expect": null, "por": {"{'a': 1, 'b': 2, 'c': 3}": "d[\"a\"] = 0 modifica el valor de \"a\".", "{'b': 2, 'c': 3, 'a': 0}": "Modificar una clave no la mueve de sitio. Solo las claves nuevas van al final.", "Error": "Asignar a una clave que no existe la crea."}}, {"id": "compuestos-5", "t": "err", "q": "", "code": "d = {\"nombre\": \"Ana\"}\nprint(d[\"edad\"])", "opts": ["KeyError", "IndexError", "TypeError", "Ningún error"], "a": 0, "exp": "Acceder a una clave que no existe da KeyError.", "expect": null, "por": {"IndexError": "IndexError sale cuando se accede a una posición de lista/tupla que no existe. Aquí no pasa eso.", "TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "Ningún error": "Sí hay error: KeyError."}}, {"id": "compuestos-6", "t": "out", "q": "", "code": "s = {3, 1, 3, 2, 1}\nprint(len(s))", "opts": ["3", "5", "2", "4"], "a": 0, "exp": "Un set no guarda duplicados: quedan 1, 2 y 3.", "expect": null, "por": {"5": "Un set elimina los repetidos.", "2": "Quedan 1, 2 y 3: tres valores distintos.", "4": "Solo hay tres valores distintos: 1, 2 y 3."}}, {"id": "compuestos-7", "t": "out", "q": "", "code": "l = [10, 20, 30, 40, 50]\nprint(l[1:3])", "opts": ["[20, 30]", "[20, 30, 40]", "[10, 20, 30]", "[30, 40]"], "a": 0, "exp": "Desde el índice 1 hasta ANTES del 3.", "expect": null, "por": {"[20, 30, 40]": "El final del slice no se incluye: para antes del índice 3.", "[10, 20, 30]": "Empieza en el índice 1 (20), no en el 0.", "[30, 40]": "El índice 1 es 20, porque se cuenta desde 0."}}, {"id": "compuestos-8", "t": "mc", "q": "Quieres guardar las coordenadas (x, y) de un punto que no van a cambiar. ¿Qué usas?", "code": "", "opts": ["Una tupla", "Una lista", "Un set", "Un diccionario"], "a": 0, "exp": "Valores fijos que van juntos: tupla.", "expect": null, "por": {"Una lista": "Funcionaría, pero la lista es para datos que cambian. Para valores fijos, tupla.", "Un set": "Un set no tiene orden: no sabrías cuál es x y cuál es y.", "Un diccionario": "Se podría, pero para dos valores fijos y ordenados lo natural es una tupla."}}, {"id": "compuestos-9", "t": "out", "q": "", "code": "print(\"Ana\" in {\"nombre\": \"Ana\"})", "opts": ["False", "True", "Error", "None"], "a": 0, "exp": "in en un diccionario mira las CLAVES, no los valores. \"Ana\" es un valor.", "expect": null, "por": {"True": "in en un dict busca en las CLAVES (\"nombre\"), no en los valores (\"Ana\").", "Error": "in con un diccionario es válido.", "None": "in siempre devuelve True o False."}}, {"id": "compuestos-10", "t": "out", "q": "", "code": "a = [1, 2]\nb = a\nb.append(3)\nprint(a)", "opts": ["[1, 2, 3]", "[1, 2]", "[3]", "Error"], "a": 0, "exp": "b = a no copia: los dos nombres apuntan a la misma lista. Para copiar usa a.copy().", "expect": null, "por": {"[1, 2]": "b = a NO copia: a y b son la misma lista, así que el append se ve en las dos.", "[3]": "append añade al final; no borra lo que había.", "Error": "Es válido: b es otro nombre para la misma lista."}}]}, {"id": "condicionales", "titulo": "Condicionales", "tema": "Tema 2", "preguntas": [{"id": "condicionales-1", "t": "out", "q": "", "code": "nota = 6\nif nota >= 5:\n    print(\"A\")\nelif nota >= 6:\n    print(\"B\")\nelse:\n    print(\"C\")", "opts": ["A", "B", "A\nB", "C"], "a": 0, "exp": "Solo se ejecuta el primer bloque que es True. El elif ya no se mira.", "expect": null, "por": {"B": "El if va primero y 6 >= 5 es True, así que el elif ya no se evalúa.", "A\nB": "En un if/elif/else solo se ejecuta UN bloque: el primero que es True.", "C": "else solo se ejecuta si todas las condiciones anteriores son False."}}, {"id": "condicionales-2", "t": "out", "q": "", "code": "edad = 17\npermiso = True\nprint(\"Entra\" if edad >= 18 or permiso else \"No\")", "opts": ["Entra", "No", "True", "Error"], "a": 0, "exp": "Con or basta con que una sea True, y permiso es True.", "expect": null, "por": {"No": "or basta con que una sea True, y permiso es True.", "True": "El ternario devuelve uno de los dos textos, no el booleano.", "Error": "Se puede usar or dentro de un ternario."}}, {"id": "condicionales-3", "t": "err", "q": "", "code": "x = 5\nif x = 5:\n    print(\"cinco\")", "opts": ["SyntaxError", "TypeError", "NameError", "Ningún error"], "a": 0, "exp": "Para comparar se usa ==. Un solo = asigna.", "expect": null, "por": {"TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "NameError": "NameError sale cuando se usa una variable que no existe o está mal escrita. Aquí no pasa eso.", "Ningún error": "Sí hay error: SyntaxError."}}, {"id": "condicionales-4", "t": "out", "q": "", "code": "t = 30\nif t < 10:\n    print(\"Frío\")\nelif t < 25:\n    print(\"Agradable\")\nelse:\n    print(\"Calor\")", "opts": ["Calor", "Agradable", "Frío", "Agradable\nCalor"], "a": 0, "exp": "30 no es < 10 ni < 25, así que entra en el else.", "expect": null, "por": {"Agradable": "30 < 25 es False.", "Frío": "30 < 10 es False.", "Agradable\nCalor": "Solo se ejecuta un bloque del if/elif/else."}}, {"id": "condicionales-5", "t": "out", "q": "", "code": "x = 0\nif x:\n    print(\"Sí\")\nelse:\n    print(\"No\")", "opts": ["No", "Sí", "0", "Error"], "a": 0, "exp": "0 cuenta como False en un if (igual que \"\", [] y None).", "expect": null, "por": {"Sí": "0 cuenta como False en un if.", "0": "Se imprime uno de los dos textos, no x.", "Error": "if x es válido con cualquier valor."}}, {"id": "condicionales-6", "t": "out", "q": "", "code": "dia = \"sábado\"\nmatch dia:\n    case \"lunes\":\n        print(\"Inicio\")\n    case \"viernes\":\n        print(\"Casi\")\n    case _:\n        print(\"Otro\")", "opts": ["Otro", "Inicio", "Casi", "Nada"], "a": 0, "exp": "case _ es el caso por defecto cuando no coincide ninguno.", "expect": null, "por": {"Inicio": "\"sábado\" no coincide con \"lunes\".", "Casi": "\"sábado\" no coincide con \"viernes\".", "Nada": "case _ recoge todo lo demás, así que siempre imprime algo."}}, {"id": "condicionales-7", "t": "out", "q": "", "code": "n = -3\nprint(\"pos\" if n > 0 else \"neg\" if n < 0 else \"cero\")", "opts": ["neg", "pos", "cero", "Error"], "a": 0, "exp": "Ternario encadenado: no es > 0, sí es < 0.", "expect": null, "por": {"pos": "-3 > 0 es False.", "cero": "Solo sería \"cero\" si no fuera > 0 ni < 0, pero -3 < 0 es True.", "Error": "Los ternarios se pueden encadenar."}}, {"id": "condicionales-8", "t": "fill", "q": "", "code": "nota = 7.5\nif nota ___ 5:\n    print(\"Aprobado\")", "opts": [">=", "=>", "=", "=<"], "a": 0, "exp": "Los operadores son >= y <=, con el = siempre detrás.", "expect": "Aprobado", "por": {"=>": "Con => el código da SyntaxError\nEse operador no existe: es >= (el = siempre detrás).", "=": "Con = el código da SyntaxError\nUn solo = asigna. Para comparar hace falta >=.", "=<": "Con =< el código da SyntaxError\nEse operador no existe: es <=. Y aquí queremos mayor o igual."}}, {"id": "condicionales-9", "t": "out", "q": "", "code": "a = True\nb = False\nprint(a and not b, a or b, not a)", "opts": ["True True False", "False True False", "True False False", "True True True"], "a": 0, "exp": "not b es True, así que a and True da True. a or b da True. not a da False.", "expect": null, "por": {"False True False": "not b es True, y True and True es True.", "True False False": "a or b es True porque a ya es True.", "True True True": "not a es False porque a es True."}}, {"id": "condicionales-10", "t": "out", "q": "", "code": "edad = 20\nentrada = False\nif edad >= 18:\n    if entrada:\n        print(\"Pasa\")\n    else:\n        print(\"Sin entrada\")\nelse:\n    print(\"Menor\")", "opts": ["Sin entrada", "Pasa", "Menor", "Pasa\nSin entrada"], "a": 0, "exp": "Entra en el primer if (20 >= 18) y dentro, como entrada es False, va al else interior.", "expect": null, "por": {"Pasa": "entrada es False, así que va al else de dentro.", "Menor": "20 >= 18 es True: entra en el if de fuera.", "Pasa\nSin entrada": "El if/else de dentro solo ejecuta uno de los dos."}}]}, {"id": "practica2", "titulo": "Tu práctica 2: datos y condiciones", "tema": "Ejercicios 2", "preguntas": [{"id": "practica2-1", "t": "out", "q": "", "code": "notas = [6, 8, 5, 9, 7]\nnotas[1] = 10\nnotas.append(8)\nprint(notas[0], notas[-1], len(notas))", "opts": ["6 8 6", "6 7 6", "6 8 5", "10 8 6"], "a": 0, "exp": "notas[1] cambia la segunda nota; append añade 8 al final, así que hay 6 notas y la última es 8.", "expect": null, "por": {"6 7 6": "append añade el 8 al final, así que el último ya no es el 7.", "6 8 5": "append aumenta la longitud: de 5 pasa a 6.", "10 8 6": "notas[1] es la SEGUNDA nota. La primera, notas[0], sigue siendo 6."}}, {"id": "practica2-2", "t": "out", "q": "", "code": "producto = (\"teclado\", 25.5, 12)\nnombre, precio, unidades = producto\nprint(precio * unidades)", "opts": ["306.0", "306", "Error", "37.5"], "a": 0, "exp": "Se desempaqueta la tupla en tres variables y se calcula el valor del stock: 25.5 × 12.", "expect": null, "por": {"306": "float × int da float: 306.0.", "Error": "Desempaquetar funciona si hay tantas variables como elementos (3 y 3).", "37.5": "Eso sería sumar precio + unidades. Aquí se multiplica."}}, {"id": "practica2-3", "t": "out", "q": "", "code": "alumno = {\"nombre\": \"Ana\", \"nota\": 7.5}\nalumno[\"nota\"] = 4\nalumno[\"aprobado\"] = alumno[\"nota\"] >= 5\nprint(alumno[\"aprobado\"], len(alumno))", "opts": ["False 3", "True 3", "False 2", "True 2"], "a": 0, "exp": "La nota se cambia a 4 ANTES de comparar, y asignar una clave nueva la añade.", "expect": null, "por": {"True 3": "La nota se cambió a 4 antes de comparar: 4 >= 5 es False.", "False 2": "Asignar alumno[\"aprobado\"] crea una clave nueva: ahora hay 3.", "True 2": "Dos fallos: la nota ya es 4 (False) y hay una clave nueva (3)."}}, {"id": "practica2-4", "t": "out", "q": "", "code": "usuarios = {\"Ana\", \"Luis\", \"Ana\", \"Pedro\"}\nusuarios.add(\"Clara\")\nusuarios.add(\"Luis\")\nprint(len(usuarios))", "opts": ["4", "6", "5", "3"], "a": 0, "exp": "El set empieza con Ana, Luis y Pedro (3). Clara suma 1. Luis ya estaba.", "expect": null, "por": {"6": "Un set no guarda duplicados: la segunda Ana y el segundo Luis no cuentan.", "5": "Luis ya estaba en el set; add no lo vuelve a meter.", "3": "Clara es nueva, así que sí se añade."}}, {"id": "practica2-5", "t": "out", "q": "", "code": "edad = 17\ntiene_permiso = True\nes_socio = True\nsancionado = True\nacceso_edad = edad >= 16 and tiene_permiso\nacceso_socio = es_socio and not sancionado\nprint(acceso_edad, acceso_socio, acceso_edad or acceso_socio)", "opts": ["True False True", "True True True", "False False False", "True False False"], "a": 0, "exp": "Como en tu ejercicio 5: and pide las dos, not invierte y or pide al menos una.", "expect": null, "por": {"True True True": "not sancionado es False, así que es_socio and False da False.", "False False False": "17 >= 16 es True y tiene permiso: acceso_edad es True.", "True False False": "or da True si al menos una es True, y acceso_edad lo es."}}, {"id": "practica2-6", "t": "out", "q": "", "code": "nota_media = 8\nrenta_baja = False\nfamilia_numerosa = True\nif nota_media < 5:\n    print(\"No admitido\")\nelif nota_media >= 9:\n    print(\"Beca completa\")\nelif nota_media >= 7 and (renta_baja or familia_numerosa):\n    print(\"Beca parcial\")\nelif nota_media >= 5:\n    print(\"Admitido sin beca\")", "opts": ["Beca parcial", "Admitido sin beca", "Beca completa", "No admitido"], "a": 0, "exp": "8 >= 7 y (False or True) es True. Es el primer bloque True, así que no se mira el siguiente.", "expect": null, "por": {"Admitido sin beca": "8 >= 5 también es True, pero el elif de la beca parcial va antes y ya se cumplió.", "Beca completa": "8 >= 9 es False.", "No admitido": "8 < 5 es False."}}, {"id": "practica2-7", "t": "out", "q": "", "code": "nota = 6\ntipo = \"Alta\" if nota >= 8 else \"Media\" if nota >= 5 else \"Baja\"\nprint(tipo)", "opts": ["Media", "Alta", "Baja", "Error"], "a": 0, "exp": "Ternario encadenado de tu ejercicio 7: 6 no es >= 8 pero sí es >= 5.", "expect": null, "por": {"Alta": "6 >= 8 es False.", "Baja": "Solo sería Baja si 6 >= 5 fuera False.", "Error": "Los ternarios se pueden encadenar."}}, {"id": "practica2-8", "t": "fill", "q": "", "code": "opcion = \"borrar\"\nmatch opcion:\n    case \"crear\":\n        print(\"Creando\")\n    case ___:\n        print(\"Borrando\")\n    case _:\n        print(\"No reconocida\")", "opts": ["\"borrar\"", "borrar", "_", "\"Borrar\""], "a": 0, "exp": "Cada case compara con un texto, entre comillas y exactamente igual.", "expect": "Borrando", "por": {"borrar": "Con borrar el código da SyntaxError\nSin comillas es un nombre de variable, no un texto. Python da error porque ese case lo captura todo.", "_": "Con _ el código da SyntaxError\n_ es el caso por defecto, y solo puede ir al final. Aquí habría dos.", "\"Borrar\"": "Con \"Borrar\" el código imprime:\nNo reconocida\nPython distingue mayúsculas: \"Borrar\" no es igual a \"borrar\", así que iría al caso por defecto."}}, {"id": "practica2-9", "t": "out", "q": "", "code": "precios = [250, 150, 300]\ncliente = {\"socio\": False, \"saldo\": 600}\ncupones = {\"DESC10\", \"OFERTA20\"}\ncupon = \"desc10\"\ntotal = sum(precios)\ntiene_descuento = cliente[\"socio\"] or cupon in cupones\nfinal = total * 0.9 if tiene_descuento else total\nprint(final, \"Aceptado\" if cliente[\"saldo\"] >= final else \"Saldo insuficiente\")", "opts": ["700 Saldo insuficiente", "630.0 Aceptado", "630.0 Saldo insuficiente", "700 Aceptado"], "a": 0, "exp": "No es socio y \"desc10\" no está en el set (que tiene \"DESC10\"). Sin descuento son 700, y 600 no llega.", "expect": null, "por": {"630.0 Aceptado": "in distingue mayúsculas: \"desc10\" no es \"DESC10\", así que no hay descuento.", "630.0 Saldo insuficiente": "No se aplica descuento: el cupón está en minúsculas.", "700 Aceptado": "El saldo (600) es menor que 700."}}, {"id": "practica2-10", "t": "out", "q": "", "code": "requisitos = (18, 6, True)\ncandidato = {\"edad\": 24, \"nota\": 5.5, \"permiso\": True}\ncumple = candidato[\"edad\"] >= requisitos[0] and candidato[\"nota\"] >= requisitos[1]\nprint(\"apto\" if cumple else \"no apto\", requisitos[1])", "opts": ["no apto 6", "apto 6", "apto 18", "no apto 18"], "a": 0, "exp": "requisitos[1] es la nota mínima (6), y 5.5 no llega.", "expect": null, "por": {"apto 6": "La edad cumple, pero 5.5 >= 6 es False, y con and basta un False.", "apto 18": "requisitos[1] es el SEGUNDO elemento (6). Además la nota no llega.", "no apto 18": "requisitos[1] es el segundo elemento: 6. requisitos[0] sería 18."}}, {"id": "practica2-11", "t": "out", "q": "", "code": "nombres = [\"Frodo\", \"Bilbo\"]\nfor posicion, nombre in enumerate(nombres):\n    print(posicion, nombre)", "opts": ["0 Frodo\n1 Bilbo", "1 Frodo\n2 Bilbo", "Frodo 0\nBilbo 1", "0\n1"], "a": 0, "exp": "enumerate da (posición, valor) empezando en 0.", "expect": null, "por": {"1 Frodo\n2 Bilbo": "Sin start=1, enumerate empieza en 0.", "Frodo 0\nBilbo 1": "Se imprime posicion primero, que es como está escrito el print.", "0\n1": "Se imprimen las dos variables, posición y nombre."}}]}, {"id": "bucles", "titulo": "Bucles y range", "tema": "Tema 3", "preguntas": [{"id": "bucles-1", "t": "out", "q": "", "code": "print(list(range(1, 10, 3)))", "opts": ["[1, 4, 7]", "[1, 4, 7, 10]", "[3, 6, 9]", "[1, 3, 6, 9]"], "a": 0, "exp": "Empieza en 1 y va de 3 en 3 sin llegar a 10.", "expect": null, "por": {"[1, 4, 7, 10]": "El final (10) nunca se incluye.", "[3, 6, 9]": "El primer número es el inicio (1), no el paso.", "[1, 3, 6, 9]": "Va de 3 en 3 desde el 1: 1, 4, 7."}}, {"id": "bucles-2", "t": "out", "q": "", "code": "print(list(range(5, 0, -2)))", "opts": ["[5, 3, 1]", "[5, 3, 1, 0]", "[5, 3]", "[]"], "a": 0, "exp": "Paso negativo: cuenta hacia atrás. El 0 no se incluye.", "expect": null, "por": {"[5, 3, 1, 0]": "De 5 restando 2: 5, 3, 1, -1… El 0 no aparece y el final no se incluye.", "[5, 3]": "1 todavía es mayor que el final (0), así que entra.", "[]": "Con paso negativo sí cuenta hacia atrás."}}, {"id": "bucles-3", "t": "out", "q": "", "code": "total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)", "opts": ["10", "15", "4", "6"], "a": 0, "exp": "1 + 2 + 3 + 4 = 10. El 5 no entra.", "expect": null, "por": {"15": "range(1, 5) no incluye el 5: 1+2+3+4 = 10.", "4": "total acumula la suma, no cuenta vueltas.", "6": "Falta el 4: range(1, 5) incluye 1, 2, 3 y 4."}}, {"id": "bucles-4", "t": "out", "q": "", "code": "i = 10\nwhile i > 0:\n    i -= 3\nprint(i)", "opts": ["-2", "1", "0", "-3"], "a": 0, "exp": "10, 7, 4, 1, -2. Cuando vale -2 la condición es False y sale.", "expect": null, "por": {"1": "Con i = 1, 1 > 0 sigue siendo True: da otra vuelta y queda en -2.", "0": "Va de 3 en 3: 10, 7, 4, 1, -2. Nunca pasa por 0.", "-3": "Desde 1, restar 3 da -2."}}, {"id": "bucles-5", "t": "out", "q": "", "code": "for n in [1, 2, 3, 4, 5]:\n    if n == 3:\n        continue\n    if n == 5:\n        break\n    print(n)", "opts": ["1\n2\n4", "1\n2", "1\n2\n4\n5", "1\n2\n3\n4"], "a": 0, "exp": "continue se salta el 3, break para en el 5 antes de imprimirlo.", "expect": null, "por": {"1\n2": "continue solo se salta el 3; el bucle sigue con el 4.", "1\n2\n4\n5": "break sale ANTES del print, así que el 5 no se imprime.", "1\n2\n3\n4": "continue se salta el print del 3."}}, {"id": "bucles-6", "t": "out", "q": "", "code": "for i, c in enumerate(\"ab\", start=1):\n    print(i, c)", "opts": ["1 a\n2 b", "0 a\n1 b", "a 1\nb 2", "1 ab"], "a": 0, "exp": "enumerate da (posición, valor). Con start=1 empieza en 1.", "expect": null, "por": {"0 a\n1 b": "start=1 hace que empiece a contar en 1.", "a 1\nb 2": "enumerate da primero la posición y luego el valor.", "1 ab": "Recorrer un texto va letra a letra."}}, {"id": "bucles-7", "t": "out", "q": "", "code": "for x, y in zip([1, 2, 3], [10, 20]):\n    print(x + y)", "opts": ["11\n22", "11\n22\n3", "11\n22\n33", "Error"], "a": 0, "exp": "zip para cuando se acaba la lista más corta.", "expect": null, "por": {"11\n22\n3": "zip para en la lista más corta: el 3 no tiene pareja.", "11\n22\n33": "La segunda lista no tiene tercer elemento.", "Error": "zip con listas de distinto tamaño no da error: se corta."}}, {"id": "bucles-8", "t": "out", "q": "", "code": "for n in [2, 4, 6]:\n    if n % 2 == 1:\n        print(\"impar\")\n        break\nelse:\n    print(\"todos pares\")", "opts": ["todos pares", "impar", "Nada", "impar\ntodos pares"], "a": 0, "exp": "El else de un for se ejecuta si el bucle acabó sin break.", "expect": null, "por": {"impar": "n % 2 == 1 es False para 2, 4 y 6.", "Nada": "El else del for se ejecuta porque no hubo break.", "impar\ntodos pares": "Ningún número es impar, así que nunca entra en el if."}}, {"id": "bucles-9", "t": "out", "q": "", "code": "d = {\"a\": 1, \"b\": 2}\nfor k in d:\n    print(k)", "opts": ["a\nb", "1\n2", "a 1\nb 2", "('a', 1)\n('b', 2)"], "a": 0, "exp": "Recorrer un diccionario directamente da sus claves.", "expect": null, "por": {"1\n2": "Eso sería recorrer d.values().", "a 1\nb 2": "Para clave y valor hace falta d.items() y dos variables.", "('a', 1)\n('b', 2)": "Eso sería imprimir cada elemento de d.items()."}}, {"id": "bucles-10", "t": "out", "q": "", "code": "c = 0\nfor f in range(3):\n    for col in range(2):\n        c += 1\nprint(c)", "opts": ["6", "5", "3", "2"], "a": 0, "exp": "Bucle anidado: 3 vueltas fuera × 2 dentro = 6.", "expect": null, "por": {"5": "El bucle de dentro da 2 vueltas por cada una de las 3 de fuera: 3 × 2 = 6.", "3": "Hay que contar las vueltas del bucle interior: 3 × 2.", "2": "El de fuera repite 3 veces el de dentro: 3 × 2."}}, {"id": "bucles-11", "t": "out", "q": "", "code": "print([x * 2 for x in range(4) if x % 2 == 0])", "opts": ["[0, 4]", "[0, 2, 4, 6]", "[2, 6]", "[4]"], "a": 0, "exp": "Los pares de range(4) son 0 y 2. Por 2 da 0 y 4.", "expect": null, "por": {"[0, 2, 4, 6]": "El if filtra: solo pasan 0 y 2, que por 2 dan 0 y 4.", "[2, 6]": "Los pares de range(4) son 0 y 2, no 1 y 3.", "[4]": "El 0 también es par: 0 % 2 == 0."}}]}, {"id": "bucles2", "titulo": "Bucles II: while, anidados y textos", "tema": "Tema 3", "preguntas": [{"id": "bucles2-1", "t": "out", "q": "", "code": "saldo = 10\nwhile saldo > 0:\n    saldo -= 4\n    print(saldo)", "opts": ["6\n2\n-2", "6\n2", "10\n6\n2", "6\n2\n-2\n-6"], "a": 0, "exp": "La condición se mira al principio de cada vuelta: con 2 todavía entra, resta y imprime -2.", "expect": null, "por": {"6\n2": "Con saldo = 2, 2 > 0 es True: entra otra vez, resta 4 e imprime -2.", "10\n6\n2": "Se resta ANTES de imprimir: el 10 nunca se imprime.", "6\n2\n-2\n-6": "Con -2, -2 > 0 es False y el bucle termina."}}, {"id": "bucles2-2", "t": "out", "q": "", "code": "n = 1\nveces = 0\nwhile n < 100:\n    n *= 3\n    veces += 1\nprint(n, veces)", "opts": ["243 5", "81 4", "243 6", "100 5"], "a": 0, "exp": "n vale 3, 9, 27, 81 y 243: cinco vueltas. Con 243 la condición ya es False.", "expect": null, "por": {"81 4": "81 < 100 sigue siendo True: hay una vuelta más que lo multiplica por 3.", "243 6": "Son 5 multiplicaciones: 3, 9, 27, 81, 243.", "100 5": "n no se queda en 100: se multiplica por 3 y luego se comprueba."}}, {"id": "bucles2-3", "t": "out", "q": "", "code": "intentos = [\"x\", \"y\", \"ok\", \"z\"]\ni = 0\nwhile intentos[i] != \"ok\":\n    i += 1\nprint(i)", "opts": ["2", "3", "1", "Error"], "a": 0, "exp": "Avanza mientras no encuentre \"ok\", que está en la posición 2.", "expect": null, "por": {"3": "Se cuenta desde 0: x 0, y 1, ok 2.", "1": "En la posición 1 está \"y\", que no es \"ok\": sigue avanzando.", "Error": "Para al encontrar \"ok\", antes de salirse de la lista."}}, {"id": "bucles2-4", "t": "out", "q": "", "code": "for i in range(1, 4):\n    print(\"*\" * i)", "opts": ["*\n**\n***", "***\n**\n*", "*\n*\n*", "*\n**\n***\n****"], "a": 0, "exp": "\"* ", "No encontrado"], "a": 0, "exp": "Búsqueda con bandera y break, como tu ejercicio 7.", "expect": null, "por": {"Posición 3": "enumerate cuenta desde 0: Isaac 0, Anna 1, Carles 2.", "Posición 2\nNo encontrado": "encontrado pasa a True, así que not encontrado es False y no se imprime.", "No encontrado": "Carles sí está en la lista."}}, {"id": "practica3-8", "t": "out", "q": "", "code": "numeros = [5, -7, 0, 10, -1, 0]\nsuma = 0\nceros = 0\nfor n in numeros:\n    if n < 0:\n        continue\n    if n == 0:\n        ceros += 1\n    else:\n        suma += n\nprint(suma, ceros)", "opts": ["15 2", "7 2", "15 0", "-3 2"], "a": 0, "exp": "continue se salta los negativos. Se suman 5 y 10 y se cuentan dos ceros.", "expect": null, "por": {"7 2": "Los negativos no se suman: continue salta a la siguiente vuelta antes de llegar a la suma.", "15 0": "Hay dos ceros y entran en el if n == 0.", "-3 2": "Los negativos se ignoran con continue."}}, {"id": "practica3-9", "t": "out", "q": "", "code": "u = {\"nombre\": \"Marc\", \"edad\": 17, \"activo\": True, \"puntos\": 80}\nif not u[\"activo\"]:\n    c = \"Inactivo\"\nelif u[\"puntos\"] >= 100:\n    c = \"Premium\"\nelse:\n    c = \"Estándar\"\nif u[\"edad\"] < 18:\n    c += \" (menor)\"\nprint(c)", "opts": ["Estándar (menor)", "Estándar", "Premium (menor)", "Inactivo"], "a": 0, "exp": "Está activo con 80 puntos (Estándar). El segundo if es independiente y añade (menor).", "expect": null, "por": {"Estándar": "El segundo if no forma parte del if/elif anterior: también se comprueba, y 17 < 18.", "Premium (menor)": "80 >= 100 es False.", "Inactivo": "activo es True, así que not activo es False."}}, {"id": "practica3-10", "t": "out", "q": "", "code": "codigo = \"1234\"\nintentos = [\"0000\", \"\", \"1234\", \"9999\"]\nacceso = False\nfor i in intentos:\n    if i == \"\":\n        pass\n    elif i == codigo:\n        acceso = True\n        break\n    else:\n        print(\"Incorrecto\", i)\nprint(acceso)", "opts": ["Incorrecto 0000\nTrue", "Incorrecto 0000\nIncorrecto \nTrue", "Incorrecto 0000\nIncorrecto 9999\nTrue", "True"], "a": 0, "exp": "El vacío entra en el pass (no hace nada), el 1234 hace break y el 9999 ya no se mira.", "expect": null, "por": {"Incorrecto 0000\nIncorrecto \nTrue": "El intento vacío entra en el primer if, donde solo hay pass, así que no imprime nada.", "Incorrecto 0000\nIncorrecto 9999\nTrue": "break sale del bucle en el 1234: el 9999 nunca se revisa.", "True": "\"0000\" no es vacío ni el código: entra en el else e imprime."}}, {"id": "practica3-11", "t": "out", "q": "", "code": "alumno = {\"nombre\": \"Isaac\", \"nota_media\": 8.5, \"faltas\": 12}\nif alumno[\"nota_media\"] >= 5 and alumno[\"faltas\"] <= 10:\n    print(\"Aprobado sin aviso\")\nelif alumno[\"nota_media\"] >= 5 and alumno[\"faltas\"] > 10:\n    print(\"Aprobado con aviso\")\nelse:\n    print(\"Suspendido\")", "opts": ["Aprobado con aviso", "Aprobado sin aviso", "Suspendido", "Aprobado sin aviso\nAprobado con aviso"], "a": 0, "exp": "Aprueba (8.5) pero tiene 12 faltas, que son más de 10.", "expect": null, "por": {"Aprobado sin aviso": "12 <= 10 es False, así que el primer if no se cumple.", "Suspendido": "El elif se cumple: 8.5 >= 5 y 12 > 10.", "Aprobado sin aviso\nAprobado con aviso": "En if/elif solo se ejecuta un bloque."}}, {"id": "practica3-12", "t": "out", "q": "", "code": "i = 5\ni = i + 1\ni += 1\nprint(i)", "opts": ["7", "6", "5", "12"], "a": 0, "exp": "i = i + 1 y i += 1 hacen lo mismo: dos sumas de 1.", "expect": null, "por": {"6": "Se suma 1 dos veces: i = i + 1 y luego i += 1.", "5": "Las dos líneas modifican i.", "12": "i += 1 suma 1, no suma i."}}]}, {"id": "funciones1", "titulo": "Funciones: return y parámetros", "tema": "Tema 4", "preguntas": [{"id": "funciones1-1", "t": "out", "q": "", "code": "def f(x):\n    x * 2\n\nprint(f(4))", "opts": ["None", "8", "4", "Error"], "a": 0, "exp": "Calcula x * 2 pero no lo devuelve. Sin return la función devuelve None.", "expect": null, "por": {"8": "Calcula x * 2, pero sin return ese valor se pierde.", "4": "La función no devuelve x: no devuelve nada (None).", "Error": "Una función sin return es válida: devuelve None."}}, {"id": "funciones1-2", "t": "out", "q": "", "code": "def saludo(n=\"mundo\"):\n    return \"Hola \" + n\n\nprint(saludo(), saludo(\"Pau\"))", "opts": ["Hola mundo Hola Pau", "Hola Pau Hola Pau", "Hola mundo Hola mundo", "Error"], "a": 0, "exp": "Si no pasas argumento usa el valor por defecto.", "expect": null, "por": {"Hola Pau Hola Pau": "La primera llamada no pasa argumento: usa \"mundo\".", "Hola mundo Hola mundo": "La segunda pasa \"Pau\", que sustituye al valor por defecto.", "Error": "Un parámetro con valor por defecto se puede omitir."}}, {"id": "funciones1-3", "t": "err", "q": "", "code": "def f(a=1, b):\n    return a + b", "opts": ["SyntaxError", "TypeError", "NameError", "Ningún error"], "a": 0, "exp": "Los parámetros con valor por defecto van después de los obligatorios.", "expect": null, "por": {"TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "NameError": "NameError sale cuando se usa una variable que no existe o está mal escrita. Aquí no pasa eso.", "Ningún error": "Sí hay error: SyntaxError."}}, {"id": "funciones1-4", "t": "out", "q": "", "code": "def f(a, b):\n    return a - b\n\nprint(f(b=10, a=3))", "opts": ["-7", "7", "Error", "13"], "a": 0, "exp": "Con argumentos por nombre el orden no importa: a=3, b=10.", "expect": null, "por": {"7": "Por nombre: a=3 y b=10, aunque b se escriba primero. 3 - 10 = -7.", "Error": "Los argumentos por nombre se pueden pasar en cualquier orden.", "13": "Es una resta, no una suma."}}, {"id": "funciones1-5", "t": "out", "q": "", "code": "def f():\n    return 1\n    print(2)\n\nprint(f())", "opts": ["1", "2", "1\n2", "None"], "a": 0, "exp": "return termina la función. El print(2) no se ejecuta nunca.", "expect": null, "por": {"2": "return termina la función: el print(2) nunca se ejecuta.", "1\n2": "return termina la función: el print(2) nunca se ejecuta.", "None": "Sí hay return: devuelve 1."}}, {"id": "funciones1-6", "t": "out", "q": "", "code": "def mm(l):\n    return min(l), max(l)\n\nx = mm([4, 9, 2])\nprint(x)", "opts": ["(2, 9)", "[2, 9]", "2 9", "2"], "a": 0, "exp": "return a, b devuelve una tupla.", "expect": null, "por": {"[2, 9]": "return a, b crea una TUPLA, con paréntesis.", "2 9": "Se imprime x, que es una tupla entera.", "2": "Devuelve los dos valores, no solo el primero."}}, {"id": "funciones1-7", "t": "out", "q": "", "code": "x = 5\ndef g():\n    x = 1\n    return x\n\nprint(g(), x)", "opts": ["1 5", "1 1", "5 5", "5 1"], "a": 0, "exp": "La x de dentro de g es local y no cambia la de fuera.", "expect": null, "por": {"1 1": "La x de dentro es local: la de fuera sigue valiendo 5.", "5 5": "g() devuelve su x local, que vale 1.", "5 1": "Al revés: g() da 1 y la x de fuera es 5."}}, {"id": "funciones1-8", "t": "err", "q": "", "code": "def total(l):\n    s = 0\n    for n in l:\n        s += n\n    print(s)\n\nr = total([1, 2]) + 1", "opts": ["TypeError", "NameError", "SyntaxError", "Ningún error"], "a": 0, "exp": "total hace print pero no return, así que devuelve None, y None + 1 da error.", "expect": null, "por": {"NameError": "NameError sale cuando se usa una variable que no existe o está mal escrita. Aquí no pasa eso.", "SyntaxError": "SyntaxError sale cuando el código está mal escrito (falta :, = en vez de ==, …) y Python ni lo ejecuta. Aquí no pasa eso.", "Ningún error": "Sí hay error: TypeError."}}, {"id": "funciones1-9", "t": "mc", "q": "En def saludar(nombre): ... y la llamada saludar(\"Ana\"), ¿qué es \"Ana\"?", "code": "", "opts": ["Un argumento", "Un parámetro", "Una variable global", "Un return"], "a": 0, "exp": "El parámetro es el nombre de la definición (nombre). El argumento es el valor que pasas (\"Ana\").", "expect": null, "por": {"Un parámetro": "El parámetro es nombre, en la definición. \"Ana\" es el valor que pasas: el argumento.", "Una variable global": "Es el valor que se pasa en la llamada.", "Un return": "return es lo que la función devuelve."}}, {"id": "funciones1-10", "t": "fill", "q": "", "code": "def doble(n):\n    ___ n * 2\n\nprint(doble(4))", "opts": ["return", "print", "def", "yield"], "a": 0, "exp": "Para que la función entregue el resultado hace falta return.", "expect": "8", "por": {"print": "Con print el código da SyntaxError\nprint necesita paréntesis, y aunque los tuviera no devolvería el valor.", "def": "Con def el código da SyntaxError\ndef sirve para definir funciones, no para devolver.", "yield": "Con yield el código imprime:\n<generator object doble at 0x000001F69F6096C0>\nyield no es de este temario: crea un generador en vez de devolver 8."}}]}, {"id": "funciones2", "titulo": "Lambda, map, filter y recursión", "tema": "Tema 4", "preguntas": [{"id": "funciones2-1", "t": "out", "q": "", "code": "def s(*n):\n    return len(n)\n\nprint(s(1, 2, 3))", "opts": ["3", "1", "6", "Error"], "a": 0, "exp": "*n agrupa todos los argumentos en una tupla de 3 elementos.", "expect": null, "por": {"1": "*n agrupa TODOS los argumentos: una tupla de 3.", "6": "len cuenta elementos; 6 sería la suma.", "Error": "Con *n puedes pasar cualquier cantidad de argumentos."}}, {"id": "funciones2-2", "t": "out", "q": "", "code": "def f(*a):\n    print(type(a))\n\nf(1)", "opts": ["<class 'tuple'>", "<class 'list'>", "<class 'int'>", "<class 'dict'>"], "a": 0, "exp": "*args siempre es una tupla.", "expect": null, "por": {"<class 'list'>": "*args es una tupla, no una lista.", "<class 'int'>": "Aunque pases un solo valor, va dentro de una tupla.", "<class 'dict'>": "Un dict sería con **kwargs."}}, {"id": "funciones2-3", "t": "out", "q": "", "code": "def f(**k):\n    print(k)\n\nf(x=1, y=2)", "opts": ["{'x': 1, 'y': 2}", "(1, 2)", "[1, 2]", "x y"], "a": 0, "exp": "**kwargs es un diccionario con los argumentos por nombre.", "expect": null, "por": {"(1, 2)": "Eso sería *args. **kwargs guarda nombre y valor en un diccionario.", "[1, 2]": "**kwargs es un diccionario con nombres y valores.", "x y": "Se imprime el diccionario entero."}}, {"id": "funciones2-4", "t": "out", "q": "", "code": "sq = lambda x: x * x\nprint(sq(5))", "opts": ["25", "10", "5", "Error"], "a": 0, "exp": "La lambda devuelve x * x automáticamente.", "expect": null, "por": {"10": "x * x es 5 · 5, no 5 + 5.", "5": "La lambda devuelve el resultado de x * x.", "Error": "Se puede guardar una lambda en una variable y llamarla."}}, {"id": "funciones2-5", "t": "out", "q": "", "code": "print(list(map(lambda x: x + 1, [1, 2, 3])))", "opts": ["[2, 3, 4]", "[1, 2, 3]", "[2]", "9"], "a": 0, "exp": "map aplica la función a cada elemento.", "expect": null, "por": {"[1, 2, 3]": "map aplica x + 1 a cada elemento.", "[2]": "map transforma todos los elementos, no solo el primero.", "9": "map no suma: devuelve otra lista."}}, {"id": "funciones2-6", "t": "out", "q": "", "code": "print(list(filter(lambda x: x > 2, [1, 5, 2, 8])))", "opts": ["[5, 8]", "[True, True]", "[1, 2]", "[False, True, False, True]"], "a": 0, "exp": "filter se queda con los elementos para los que la función da True.", "expect": null, "por": {"[True, True]": "filter no devuelve True/False: devuelve los elementos que cumplen.", "[1, 2]": "Esos son los que NO cumplen x > 2.", "[False, True, False, True]": "Eso sería map. filter devuelve los elementos que dan True."}}, {"id": "funciones2-7", "t": "out", "q": "", "code": "ps = [{\"n\": \"A\", \"e\": 30}, {\"n\": \"B\", \"e\": 20}]\nprint(sorted(ps, key=lambda p: p[\"e\"])[0][\"n\"])", "opts": ["B", "A", "20", "Error"], "a": 0, "exp": "Ordena por edad de menor a mayor: B (20) va primero.", "expect": null, "por": {"A": "sorted ordena de menor a mayor: 20 va antes que 30.", "20": "Se imprime [\"n\"], el nombre.", "Error": "sorted con key=lambda funciona con listas de diccionarios."}}, {"id": "funciones2-8", "t": "out", "q": "", "code": "def fact(n):\n    if n == 0:\n        return 1\n    return n * fact(n - 1)\n\nprint(fact(3))", "opts": ["6", "3", "0", "9"], "a": 0, "exp": "3 * 2 * 1 * 1 = 6. El caso base es n == 0.", "expect": null, "por": {"3": "Se multiplica: 3 * fact(2) = 3 * 2 = 6.", "0": "Con n == 0 devuelve 1, no 0.", "9": "Es 3 · 2 · 1, no 3 · 3."}}, {"id": "funciones2-9", "t": "mc", "q": "¿Qué pasa si una función recursiva no tiene caso base?", "code": "", "opts": ["Se llama sin parar hasta dar RecursionError", "Devuelve None", "Devuelve 0", "Python la convierte en bucle"], "a": 0, "exp": "Sin caso base nunca para, y Python corta con RecursionError.", "expect": null, "por": {"Devuelve None": "Nunca llega a devolver nada: se llama sin parar.", "Devuelve 0": "Nunca llega a devolver nada: se llama sin parar.", "Python la convierte en bucle": "Python no hace eso: la corta con RecursionError."}}, {"id": "funciones2-10", "t": "out", "q": "", "code": "l = [3, 1, 2]\nr = l.sort()\nprint(r)", "opts": ["None", "[1, 2, 3]", "[3, 1, 2]", "Error"], "a": 0, "exp": "l.sort() ordena la lista original y devuelve None. sorted(l) sí devuelve una lista nueva.", "expect": null, "por": {"[1, 2, 3]": "l.sort() ordena l pero devuelve None, y se imprime r.", "[3, 1, 2]": "Se imprime r, no l.", "Error": "No da error: r simplemente vale None."}}, {"id": "funciones2-11", "t": "out", "q": "", "code": "print(max([\"pera\", \"kiwi\", \"plátano\"], key=lambda s: len(s)))", "opts": ["plátano", "pera", "kiwi", "7"], "a": 0, "exp": "key indica qué se compara: la longitud. El más largo es plátano.", "expect": null, "por": {"pera": "key=len compara longitudes: plátano (7 letras) es la más larga.", "kiwi": "key=len compara longitudes: plátano (7 letras) es la más larga.", "7": "max devuelve el elemento, no su longitud."}}]}, {"id": "funciones3", "titulo": "Funciones III: escribir y seguir", "tema": "Tema 4", "preguntas": [{"id": "funciones3-1", "t": "fill", "q": "", "code": "def es_par(n):\n    return n % 2 ___ 0\n\nprint(es_par(4), es_par(7))", "opts": ["==", "=", "!=", ">"], "a": 0, "exp": "Una función que dice True/False puede devolver directamente la comparación.", "expect": "True False", "por": {"=": "Con = el código da SyntaxError\n= asigna. Dentro de return hay que comparar con ==.", "!=": "Con != el código imprime:\nFalse True\nInvierte el resultado: sería es_impar.", ">": "Con > el código imprime:\nFalse True\nn % 2 > 0 es True para los impares: sería es_impar."}}, {"id": "funciones3-2", "t": "fill", "q": "", "code": "def area(base, altura=___):\n    return base * altura / 2\n\nprint(area(4), area(4, 10))", "opts": ["2", "1", "0", "None"], "a": 0, "exp": "area(4) usa el valor por defecto: 4 * 2 / 2 = 4.0.", "expect": "4.0 20.0", "por": {"1": "Con 1 el código imprime:\n2.0 20.0\nCon altura 1, area(4) da 2.0, no 4.0.", "0": "Con 0 el código imprime:\n0.0 20.0\nCon altura 0 el área sería 0.0.", "None": "Con None el código da TypeError\n4 * None da error."}}, {"id": "funciones3-3", "t": "out", "q": "", "code": "def contar(l, valor):\n    c = 0\n    for x in l:\n        if x == valor:\n            c += 1\n    return c\n\nprint(contar([1, 2, 1, 1], 1))", "opts": ["3", "1", "4", "2"], "a": 0, "exp": "El return está FUERA del for: primero recorre toda la lista y luego devuelve.", "expect": null, "por": {"1": "El return va después del bucle, así que cuenta todos los 1.", "4": "Solo cuenta los que son iguales a 1.", "2": "Hay tres 1 en la lista."}}, {"id": "funciones3-4", "t": "out", "q": "", "code": "def contar(l, valor):\n    c = 0\n    for x in l:\n        if x == valor:\n            c += 1\n        return c\n\nprint(contar([1, 2, 1, 1], 1))", "opts": ["1", "3", "0", "None"], "a": 0, "exp": "Error típico: el return está DENTRO del for, así que la función termina en la primera vuelta.", "expect": null, "por": {"3": "Fíjate en la sangría: return está dentro del for y acaba en la primera vuelta.", "0": "La primera x ya es 1, así que c vale 1 cuando llega al return.", "None": "Sí hay return (aunque esté mal colocado)."}}, {"id": "funciones3-5", "t": "out", "q": "", "code": "def f(x):\n    if x > 0:\n        return \"pos\"\n\nprint(f(5), f(-1))", "opts": ["pos None", "pos neg", "pos", "pos False"], "a": 0, "exp": "Si x no es > 0, la función acaba sin pasar por ningún return y devuelve None.", "expect": null, "por": {"pos neg": "No hay ningún return \"neg\". Sin return se devuelve None.", "pos": "Se imprimen dos valores, uno por cada llamada.", "pos False": "Sin return no devuelve False: devuelve None."}}, {"id": "funciones3-6", "t": "out", "q": "", "code": "def aplicar(f, x):\n    return f(x)\n\nprint(aplicar(lambda n: n * 3, 4))", "opts": ["12", "7", "4", "Error"], "a": 0, "exp": "Las funciones se pueden pasar como argumento: aplicar llama a la lambda con 4.", "expect": null, "por": {"7": "La lambda multiplica (n * 3), no suma.", "4": "aplicar no devuelve x: devuelve f(x).", "Error": "En Python las funciones son objetos y se pueden pasar como argumento."}}, {"id": "funciones3-7", "t": "out", "q": "", "code": "def potencia(b, e):\n    if e == 0:\n        return 1\n    return b * potencia(b, e - 1)\n\nprint(potencia(2, 3))", "opts": ["8", "6", "9", "1"], "a": 0, "exp": "2 * potencia(2, 2) = 2 * 2 * potencia(2, 1) = 2 * 2 * 2 * 1 = 8.", "expect": null, "por": {"6": "Es 2 · 2 · 2, no 2 · 3.", "9": "Eso sería 3 ** 2. Aquí la base es 2 y el exponente 3.", "1": "1 es el caso base, pero cada llamada lo multiplica por b."}}, {"id": "funciones3-8", "t": "out", "q": "", "code": "def cuenta(n):\n    if n == 0:\n        return\n    print(n)\n    cuenta(n - 1)\n\ncuenta(3)", "opts": ["3\n2\n1", "1\n2\n3", "3\n2\n1\n0", "3"], "a": 0, "exp": "Imprime y después se llama con n - 1. Con 0 para sin imprimir.", "expect": null, "por": {"1\n2\n3": "Imprime ANTES de llamarse, así que va de mayor a menor.", "3\n2\n1\n0": "Con n == 0 hace return antes del print.", "3": "Se vuelve a llamar con n - 1 hasta llegar a 0."}}, {"id": "funciones3-9", "t": "out", "q": "", "code": "def media(*n):\n    return sum(n) / len(n)\n\nprint(media(4, 6, 8))", "opts": ["6.0", "18", "6", "Error"], "a": 0, "exp": "*n recoge (4, 6, 8) en una tupla: 18 / 3.", "expect": null, "por": {"18": "18 es la suma; falta dividir entre len(n).", "6": "/ siempre da float: 6.0.", "Error": "sum y len funcionan con tuplas."}}, {"id": "funciones3-10", "t": "out", "q": "", "code": "def info(nombre, **extra):\n    print(nombre, len(extra))\n\ninfo(\"Pau\", edad=24, curso=\"IA\")", "opts": ["Pau 2", "Pau 3", "Pau", "Error"], "a": 0, "exp": "nombre recoge \"Pau\" y **extra recoge solo los argumentos con nombre que sobran: edad y curso.", "expect": null, "por": {"Pau 3": "nombre no entra en **extra: extra solo tiene edad y curso.", "Pau": "El print también muestra len(extra).", "Error": "**extra recoge los argumentos con nombre que no tienen parámetro propio."}}, {"id": "funciones3-11", "t": "out", "q": "", "code": "def mm(l):\n    return min(l), max(l)\n\nmn, mx = mm([3, 8, 1])\nprint(mx - mn)", "opts": ["7", "-7", "(1, 8)", "Error"], "a": 0, "exp": "Se desempaqueta la tupla: mn = 1, mx = 8.", "expect": null, "por": {"-7": "Se calcula mx - mn = 8 - 1.", "(1, 8)": "La tupla se desempaqueta en mn y mx; se imprime la resta.", "Error": "Una tupla de 2 se puede desempaquetar en 2 variables."}}, {"id": "funciones3-12", "t": "mc", "q": "¿Qué devuelve una función que termina con return a, b?", "code": "", "opts": ["Una tupla (a, b)", "Solo a", "Una lista [a, b]", "Da error"], "a": 0, "exp": "Varios valores separados por comas forman una tupla.", "expect": null, "por": {"Solo a": "Devuelve los dos valores juntos.", "Una lista [a, b]": "Es una tupla, con paréntesis, no una lista.", "Da error": "Devolver varios valores es válido en Python."}}, {"id": "funciones3-13", "t": "out", "q": "", "code": "total = 0\ndef sumar(x):\n    return total + x\n\nprint(sumar(5))", "opts": ["5", "Error", "0", "None"], "a": 0, "exp": "Una función puede LEER una variable de fuera. Lo que no conviene es modificarla desde dentro.", "expect": null, "por": {"Error": "Leer una variable global desde una función sí está permitido.", "0": "Devuelve total + x = 0 + 5.", "None": "Sí hay return."}}]}, {"id": "estadistica", "titulo": "Estadística y ordenación", "tema": "ML (solo Python)", "preguntas": [{"id": "estadistica-1", "t": "out", "q": "", "code": "l = [2, 4, 9]\nprint(sum(l) / len(l))", "opts": ["5.0", "5", "15", "3"], "a": 0, "exp": "Media = suma / cantidad = 15 / 3. La división / da float.", "expect": null, "por": {"5": "/ siempre da float.", "15": "Esa es la suma; falta dividir entre len(l).", "3": "3 es la cantidad de elementos."}}, {"id": "estadistica-2", "t": "out", "q": "", "code": "o = sorted([7, 1, 3, 9])\nn = len(o)\nprint((o[n // 2 - 1] + o[n // 2]) / 2)", "opts": ["5.0", "3", "7", "5"], "a": 0, "exp": "Ordenada: [1, 3, 7, 9]. Como n es par, la mediana es la media de 3 y 7.", "expect": null, "por": {"3": "Con n par, la mediana es la media de los DOS centrales: (3 + 7) / 2.", "7": "Con n par, la mediana es la media de los DOS centrales: (3 + 7) / 2.", "5": "/ siempre da float: 5.0."}}, {"id": "estadistica-3", "t": "mc", "q": "La varianza POBLACIONAL divide la suma de cuadrados entre…", "code": "", "opts": ["n", "n - 1", "n + 1", "la media"], "a": 0, "exp": "Poblacional: entre n. Muestral: entre n - 1 (es lo que hace pandas .var() por defecto).", "expect": null, "por": {"n - 1": "Entre n - 1 es la MUESTRAL (lo que hace pandas por defecto).", "n + 1": "No existe esa versión.", "la media": "La media se resta a cada dato; luego se divide entre n."}}, {"id": "estadistica-4", "t": "out", "q": "", "code": "l = [1, 2, 2, 3, 3, 3]\nprint(max(set(l), key=l.count))", "opts": ["3", "2", "6", "1"], "a": 0, "exp": "El valor que más se repite (la moda) es 3, que aparece 3 veces.", "expect": null, "por": {"2": "2 aparece 2 veces, pero 3 aparece 3.", "6": "max devuelve el valor que más se repite, no cuántas veces.", "1": "1 aparece solo una vez."}}, {"id": "estadistica-5", "t": "out", "q": "", "code": "l = [\"a\", \"b\", \"a\"]\nf = {}\nfor x in l:\n    if x in f:\n        f[x] += 1\n    else:\n        f[x] = 1\nprint(f)", "opts": ["{'a': 2, 'b': 1}", "{'a': 1, 'b': 1}", "{'b': 1, 'a': 2}", "['a', 'b']"], "a": 0, "exp": "Patrón de frecuencias: si la clave existe suma 1, si no la crea con 1.", "expect": null, "por": {"{'a': 1, 'b': 1}": "La segunda \"a\" entra en el if y suma 1: queda 2.", "{'b': 1, 'a': 2}": "El dict mantiene el orden de creación: \"a\" se creó primero.", "['a', 'b']": "f es un diccionario de frecuencias."}}, {"id": "estadistica-6", "t": "out", "q": "", "code": "o = [3, 2, 1]\nfor j in range(2):\n    if o[j] > o[j + 1]:\n        o[j], o[j + 1] = o[j + 1], o[j]\nprint(o)", "opts": ["[2, 1, 3]", "[1, 2, 3]", "[3, 2, 1]", "[2, 3, 1]"], "a": 0, "exp": "Una sola pasada de burbuja: el mayor (3) acaba al final, pero el resto todavía no está ordenado.", "expect": null, "por": {"[1, 2, 3]": "Es una sola pasada: el 3 llega al final, pero el 2 y el 1 aún no se ordenan.", "[3, 2, 1]": "Sí hay intercambios: 3 > 2 y después 3 > 1.", "[2, 3, 1]": "Después de cambiar 3 y 2, se compara 3 con 1 y también se cambian."}}, {"id": "estadistica-7", "t": "mc", "q": "¿Qué método de ordenación compara siempre elementos VECINOS (j y j+1)?", "code": "", "opts": ["Burbuja", "Selección", "Intercambio directo", "Ninguno"], "a": 0, "exp": "Burbuja compara vecinos. Selección busca el mínimo y hace un intercambio por pasada.", "expect": null, "por": {"Selección": "Selección busca la posición del mínimo y hace un intercambio por pasada.", "Intercambio directo": "Intercambio directo compara la posición i con TODAS las siguientes, no con la vecina.", "Ninguno": "Burbuja compara j con j + 1."}}, {"id": "estadistica-8", "t": "out", "q": "", "code": "l = [10, 20, 30]\nmn, mx = min(l), max(l)\nprint([(x - mn) / (mx - mn) for x in l])", "opts": ["[0.0, 0.5, 1.0]", "[0, 1, 2]", "[10, 20, 30]", "[0.1, 0.2, 0.3]"], "a": 0, "exp": "Min-max deja el mínimo en 0, el máximo en 1 y el resto entre medias.", "expect": null, "por": {"[0, 1, 2]": "Se divide entre (max - min) = 20, y / da float.", "[10, 20, 30]": "La comprensión crea valores nuevos con la fórmula.", "[0.1, 0.2, 0.3]": "Eso sería dividir entre 100. Min-max resta el mínimo y divide entre el rango."}}, {"id": "estadistica-9", "t": "mc", "q": "Un alumno tiene un z-score de -1.5. ¿Qué significa?", "code": "", "opts": ["Está 1.5 desviaciones típicas por debajo de la media", "Ha sacado -1.5 puntos", "Está 1.5 puntos por debajo de la media", "Está por encima de la media"], "a": 0, "exp": "z = (x - media) / desviación. Negativo es por debajo; el número son desviaciones típicas.", "expect": null, "por": {"Ha sacado -1.5 puntos": "z no es una nota: indica a cuántas desviaciones está de la media.", "Está 1.5 puntos por debajo de la media": "Son desviaciones típicas, no puntos.", "Está por encima de la media": "Negativo significa por debajo."}}, {"id": "estadistica-10", "t": "out", "q": "", "code": "mayor = 0\nfor n in [-4, -2, -7]:\n    if n > mayor:\n        mayor = n\nprint(mayor)", "opts": ["0", "-2", "-7", "-4"], "a": 0, "exp": "Trampa clásica: ningún número supera el 0 inicial. Hay que empezar con mayor = l[0].", "expect": null, "por": {"-2": "Sería lo correcto si empezara con mayor = l[0]. Con 0, ningún negativo lo supera.", "-7": "Ningún número supera el 0 inicial, así que mayor nunca cambia.", "-4": "Ningún número supera el 0 inicial, así que mayor nunca cambia."}}, {"id": "estadistica-11", "t": "mc", "q": "¿Qué diferencia hay entre sorted(l) y l.sort()?", "code": "", "opts": ["sorted devuelve una lista nueva; sort cambia l y devuelve None", "Ninguna", "sort devuelve una lista nueva; sorted cambia l", "sorted solo funciona con números"], "a": 0, "exp": "Si necesitas conservar la original, usa sorted o haz una copia.", "expect": null, "por": {"Ninguna": "sorted devuelve una lista nueva; sort cambia l y devuelve None.", "sort devuelve una lista nueva; sorted cambia l": "Es al revés.", "sorted solo funciona con números": "sorted también ordena textos."}}]}, {"id": "practicaml", "titulo": "Tu práctica ML: estadística a mano", "tema": "ML 3 (sin pandas)", "preguntas": [{"id": "practicaml-1", "t": "out", "q": "", "code": "puntos = [50, 60, 60, 70, 70, 80, 80, 80, 90, 100]\nsuma = 0\nfor valor in puntos:\n    suma += valor\nprint(suma / len(puntos))", "opts": ["74.0", "740", "74", "75.0"], "a": 0, "exp": "Media con bucle: 740 / 10.", "expect": null, "por": {"740": "740 es la suma; falta dividir entre la cantidad.", "74": "/ siempre da float.", "75.0": "75 es la mediana, no la media."}}, {"id": "practicaml-2", "t": "out", "q": "", "code": "o = [50, 60, 60, 70, 70, 80, 80, 80, 90, 100]\nn = len(o)\nprint(o[n // 2 - 1], o[n // 2])", "opts": ["70 80", "80 80", "70 70", "60 70"], "a": 0, "exp": "n = 10: los centrales son las posiciones 4 y 5 (quinto y sexto valor). La mediana es (70 + 80) / 2 = 75.", "expect": null, "por": {"80 80": "n // 2 - 1 es 4, la quinta posición, que vale 70.", "70 70": "o[n // 2] es o[5], la sexta posición, que vale 80.", "60 70": "Recuerda que se cuenta desde 0: o[4] es 70."}}, {"id": "practicaml-3", "t": "out", "q": "", "code": "o = [3, 1, 2]\ni = 0\nfor j in range(i + 1, len(o)):\n    if o[j] < o[i]:\n        o[i], o[j] = o[j], o[i]\nprint(o)", "opts": ["[1, 3, 2]", "[1, 2, 3]", "[3, 1, 2]", "[2, 1, 3]"], "a": 0, "exp": "Solo la primera pasada del intercambio directo (i = 0): el 1 sube al principio, pero el 3 y el 2 todavía no se comparan.", "expect": null, "por": {"[1, 2, 3]": "Es solo la pasada i = 0; la que ordena el 3 y el 2 sería i = 1.", "[3, 1, 2]": "1 < 3, así que sí se intercambian.", "[2, 1, 3]": "Se compara la posición 0 con las siguientes, no vecinos como en burbuja."}}, {"id": "practicaml-4", "t": "out", "q": "", "code": "o = [4, 2, 3, 1]\ni = 0\npos_min = i\nfor j in range(i + 1, len(o)):\n    if o[j] < o[pos_min]:\n        pos_min = j\no[i], o[pos_min] = o[pos_min], o[i]\nprint(o, pos_min)", "opts": ["[1, 2, 3, 4] 3", "[2, 4, 3, 1] 1", "[4, 2, 3, 1] 3", "[1, 2, 3, 4] 0"], "a": 0, "exp": "Selección: busca la posición del mínimo (el 1, en la posición 3) y hace UN intercambio con la posición 0.", "expect": null, "por": {"[2, 4, 3, 1] 1": "Selección no cambia al primer menor que encuentra: recorre todo y se queda con el mínimo (el 1).", "[4, 2, 3, 1] 3": "El intercambio de la última línea sí se ejecuta.", "[1, 2, 3, 4] 0": "pos_min guarda dónde estaba el mínimo: la posición 3."}}, {"id": "practicaml-5", "t": "out", "q": "", "code": "puntos = [50, 60, 60, 80, 80, 80]\nfrecuencias = {}\nfor valor in puntos:\n    if valor in frecuencias:\n        frecuencias[valor] += 1\n    else:\n        frecuencias[valor] = 1\nmoda = puntos[0]\nmayor = 0\nfor valor in frecuencias:\n    if frecuencias[valor] > mayor:\n        mayor = frecuencias[valor]\n        moda = valor\nprint(moda, mayor)", "opts": ["80 3", "60 2", "50 1", "3 80"], "a": 0, "exp": "Moda con diccionario: 80 aparece 3 veces.", "expect": null, "por": {"60 2": "60 aparece 2 veces, pero 80 aparece 3.", "50 1": "moda empieza en 50, pero se actualiza cuando encuentra una frecuencia mayor.", "3 80": "Se imprime moda (el valor) y luego mayor (cuántas veces)."}}, {"id": "practicaml-6", "t": "out", "q": "", "code": "media = 74\nprint([valor - media for valor in [50, 74, 100]])", "opts": ["[-24, 0, 26]", "[24, 0, 26]", "[-24.0, 0.0, 26.0]", "[50, 74, 100]"], "a": 0, "exp": "Desviación = valor - media. Negativa por debajo, positiva por encima.", "expect": null, "por": {"[24, 0, 26]": "50 - 74 es negativo: está por debajo de la media.", "[-24.0, 0.0, 26.0]": "Todo son int, y int - int sigue siendo int.", "[50, 74, 100]": "La comprensión crea una lista nueva con las restas."}}, {"id": "practicaml-7", "t": "out", "q": "", "code": "l = [2, 4, 6]\nm = sum(l) / len(l)\nvar = sum(map(lambda x: (x - m) ** 2, l)) / len(l)\nprint(round(var, 2), round(var ** 0.5, 2))", "opts": ["2.67 1.63", "4.0 2.0", "8.0 2.83", "2.67 2.67"], "a": 0, "exp": "Media 4. Cuadrados: 4, 0, 4. Suma 8, entre n = 3: 2.67. La desviación es la raíz: 1.63.", "expect": null, "por": {"4.0 2.0": "Eso es dividir entre n - 1 = 2 (muestral). Aquí se divide entre len(l) = 3.", "8.0 2.83": "8 es la suma de cuadrados; falta dividir entre n.", "2.67 2.67": "La desviación estándar es la RAÍZ de la varianza (** 0.5)."}}, {"id": "practicaml-8", "t": "err", "q": "", "code": "normalizados = []\nnormalizados[0] = 0.5", "opts": ["IndexError", "KeyError", "TypeError", "Ningún error"], "a": 0, "exp": "Asignar por índice solo cambia una posición que ya existe. En una lista vacía hay que usar append, o crearla con [0] * n.", "expect": null, "por": {"KeyError": "KeyError sale cuando se busca una clave que no está en un diccionario. Aquí no pasa eso.", "TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "Ningún error": "Sí hay error: IndexError."}}, {"id": "practicaml-9", "t": "out", "q": "", "code": "alumnos = [{\"nombre\": \"Ana\", \"p\": 50}, {\"nombre\": \"Hugo\", \"p\": 80}, {\"nombre\": \"Lucía\", \"p\": 100}]\nmedia = 74\nprint(list(map(lambda f: f[\"nombre\"], filter(lambda f: f[\"p\"] > media, alumnos))))", "opts": ["['Hugo', 'Lucía']", "['Ana']", "[80, 100]", "[True, True]"], "a": 0, "exp": "filter se queda con los que superan la media y map saca su nombre (tu ejercicio 10 de ML).", "expect": null, "por": {"['Ana']": "El filtro es p > media: Ana (50) queda por debajo.", "[80, 100]": "map extrae f[\"nombre\"], no los puntos.", "[True, True]": "filter devuelve los elementos, no True/False."}}, {"id": "practicaml-10", "t": "out", "q": "", "code": "print(round((100 - 74) / 14.28, 2))", "opts": ["1.82", "26", "-1.82", "0.26"], "a": 0, "exp": "z = (valor - media) / desviación. Lucía (100) está a 1.82 desviaciones por encima.", "expect": null, "por": {"26": "26 es la distancia a la media; falta dividir entre la desviación.", "-1.82": "100 está por encima de la media, así que z es positivo.", "0.26": "Se divide entre la desviación (14.28), no entre 100."}}, {"id": "practicaml-11", "t": "out", "q": "", "code": "print(max(map(lambda v: abs(v - 74), [50, 60, 100])))", "opts": ["26", "24", "-24", "100"], "a": 0, "exp": "abs quita el signo. Distancias: 24, 14 y 26. La mayor es 26.", "expect": null, "por": {"24": "abs(50 - 74) es 24, pero 100 se aleja 26.", "-24": "abs siempre da un número positivo.", "100": "max se aplica a las distancias, no a los valores originales."}}]}, {"id": "errores", "titulo": "¿Qué error da?", "tema": "Todos", "preguntas": [{"id": "errores-1", "t": "err", "q": "", "code": "l = [1, 2, 3]\nprint(l[3])", "opts": ["IndexError", "KeyError", "TypeError", "Ningún error"], "a": 0, "exp": "Una lista de 3 elementos tiene los índices 0, 1 y 2.", "expect": null, "por": {"KeyError": "KeyError sale cuando se busca una clave que no está en un diccionario. Aquí no pasa eso.", "TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "Ningún error": "Sí hay error: IndexError."}}, {"id": "errores-2", "t": "err", "q": "", "code": "print(10 / 0)", "opts": ["ZeroDivisionError", "TypeError", "SyntaxError", "Ningún error"], "a": 0, "exp": "No se puede dividir entre 0.", "expect": null, "por": {"TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se modifica algo inmutable. Aquí no pasa eso.", "SyntaxError": "SyntaxError sale cuando el código está mal escrito (falta :, = en vez de ==, …) y Python ni lo ejecuta. Aquí no pasa eso.", "Ningún error": "Sí hay error: ZeroDivisionError."}}, {"id": "errores-3", "t": "err", "q": "", "code": "d = {}\nd[\"x\"] += 1", "opts": ["KeyError", "TypeError", "IndexError", "Ningún error"], "a": 0, "exp": "d[\"x\"] += 1 primero lee d[\"x\"], que no existe. Por eso en frecuencias se comprueba antes con in.", "expect": null, "por": {"TypeError": "TypeError sale cuando se mezclan tipos incompatibles (str + int, None + 1) o se function leer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let mejores = leer("tren-mejores", {});
let fallos = new Set(leer("tren-fallos", []));
const guardarFallos = () => guardar("tren-fallos", [...fallos]);

/* ---- utilidades ---- */
const $app = document.getElementById("app");
const $accion = document.getElementById("accion");
const $btn = document.getElementById("btn-accion");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const opcionCorta = t => `<code class="opc">${esc(t.includes("\n") ? t.replace(/\n/g, " ⏎ ") : t)}</code>`;
function barajar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const RE = /(___)|(#.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|elif|else|for|while|in|and|or|not|break|continue|pass|lambda|match|case|True|False|None)\b|\b(print|len|range|sum|min|max|sorted|list|set|enumerate|zip|map|filter|type|int|str|float)\b|\b(\d+(?:\.\d+)?)\b/gm;
function resaltar(code) {
  let out = "", last = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? '<span class="hueco">___</span>'
         : m[2] ? `<span class="tk-c">${t}</span>`
         : m[3] ? `<span class="tk-s">${t}</span>`
         : m[4] ? `<span class="tk-k">${t}</span>`
         : m[5] ? `<span class="tk-b">${t}</span>`
         : `<span class="tk-n">${t}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

      }).join("")}
    </ol>
    <p class="pie">El progreso se guarda solo en este navegador. <button type="button" id="b-reset">Borrar progreso</button></p>`;
  document.getElementById("b-rnd").onclick = () => empezar("aleatorio", "Aleatorio", barajar(TODAS).slice(0, 10));
  document.getElementById("b-rev").onclick = () => { if (fallos.size) empezar("fallos", "Repaso de fallos", barajar([...fallos].map(id => POR_ID[id]).filter(Boolean))); };
  const reset = document.getElementById("b-reset");
  reset.onclick = () => {
    if (reset.dataset.seguro) { mejores = {}; fallos = new Set(); guardar("tren-mejores", mejores); guardarFallos(); pintarPortada(); }
    else { reset.dataset.seguro = "1"; reset.textContent = "Toca otra vez para confirmar"; }
  };
  $app.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => abrirExamen(b.dataset.ex));
  window.scrollTo(0, 0);
}

function pintarPregunta() {
  const r = ronda, p = r.preguntas[r.i];
  r.opciones = barajar(p.opts.map((txt, idx) => ({ txt, ok: idx === p.a })));
  const mono = p.t !== "mc";
  $accion.hidden = true;
  $app.innerHTML = `
    <div class="top">
      <button class="salir" id="b-salir" type="button" aria-label="Salir del examen">✕</button>
      <div class="barra"><i style="width:${(r.i / r.preguntas.length) * 100}%"></i></div>
      <span class="cuenta">${r.i + 1}/${r.preguntas.length}</span>
    </div>
    <div class="tipo">${TIPOS[p.t]}${r.clave === "aleatorio" || r.clave === "fallos" ? " · " + esc(p.examen) : ""}</div>
    ${p.q ? `<p class="enunciado">${esc(p.q)}</p>` : ""}
    ${p.code ? `<pre class="code">${resaltar(p.code)}</pre>` : ""}
    <div class="opciones">
      ${r.opciones.map((o, i) => `<button class="op ${mono ? "mono" : ""}" type="button" data-i="${i}"><span class="letra">${LETRAS[i]}</span><span class="txt">${esc(o.txt)}</span></button>`).join("")}
    </div>
    <div id="explica"></div>`;
  document.getElementById("b-salir").onclick = pintarPortada;
  $app.querySelectorAll(".op").forEach(b => b.onclick = () => responder(+b.dataset.i));
  window.scrollTo(0, 0);
}

function responder(i) {
  const r = ronda, p = r.preguntas[r.i], elegida = r.opciones[i];
  const acierto = elegida.ok;
  if (acierto) { r.aciertos++; fallos.delete(p.id); } else { fallos.add(p.id); }
  guardarFallos();
  r.respuestas.push({ p, elegida: elegida.txt, acierto });

  $app.querySelectorAll(".op").forEach((b, j) => {
    b.disabled = true;
    const o = r.opciones[j];
    if (o.ok) b.classList.add("ok");
    else if (j === i) b.classList.add("mal");
    else b.classList.add("apagada");
  });
  document.getElementById("explica").innerHTML = acierto
    ? `<div class="explica ok"><b>Correcto</b>${esc(p.exp)}</div>`
    : `<div class="explica mal">
         <b>Por qué ${opcionCorta(elegida.txt)} no</b><span class="pq">${esc(p.por[elegida.txt] || "")}</span>
         <b class="bien-tit">La buena es ${opcionCorta(p.opts[p.a])}</b>${esc(p.exp)}
       </div>`;
  document.querySelector(".barra i").style.width = `${((r.i + 1) / r.preguntas.length) * 100}%`;

  const ultima = r.i === r.preguntas.length - 1;
  $btn.textContent = ultima ? "Ver resultado" : "Siguiente";
  $btn.onclick = () => { if (ultima) pintarResultado(); else { r.i++; pintarPregunta(); } };
  $accion.hidden = false;
  document.getElementById("explica").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function pintarResultado() {
  const r = ronda, n = r.preguntas.length;
  $accion.hidden = true;
  if (EXAMENES.some(e => e.id === r.clave)) {
    mejores[r.clave] = Math.max(mejores[r.clave] ?? 0, r.aciertos);
    guardar("tren-mejores", mejores);
  }
  const nota = r.aciertos / n * 10;
  const frase = nota >= 9 ? "Esto ya lo tienes." : nota >= 7 ? "Bien. Mira los fallos y repítelo." : nota >= 5 ? "Aprobado justo. Repasa la chuleta de este tema." : "Repasa este tema y vuelve a intentarlo.";
  const mal = r.respuestas.filter(x => !x.acierto);
  $app.innerHTML = `
    <div class="marcador">
      <div class="eyebrow">${esc(r.titulo)}</div>
      <div class="grande">${r.aciertos}<small>/${n}</small></div>
      <p>${frase}</p>
    </div>
    <div class="botones">
      <button type="button" id="b-volver">Volver a la línea</button>
      <button type="button" class="prim" id="b-otra">${mal.length ? "Repetir los fallos" : "Repetir"}</button>
    </div>
    ${mal.map(x => `
      <div class="fallo">
        ${x.p.q ? `<p class="enunciado">${esc(x.p.q)}</p>` : ""}
        ${x.p.code ? `<pre class="code">${resaltar(x.p.code)}</pre>` : ""}
        <div class="resp">
          <div class="tu">Tu respuesta: <code>${esc(x.elegida)}</code></div>
          <div class="por">${esc(x.p.por[x.elegida] || "")}</div>
          <div class="bien">Correcta: <code>${esc(x.p.opts[x.p.a])}</code></div>
          <div class="por">${esc(x.p.exp)}</div>
        </div>
      </div>`).join("")}`;
  document.getElementById("b-volver").onclick = pintarPortada;
  document.getElementById("b-otra").onclick = () =>
    mal.length ? empezar("fallos", "Repaso de fallos", barajar(mal.map(x => x.p))) : empezar(r.clave, r.titulo, r.preguntas.slice());
  window.scrollTo(0, 0);
}

pintarPortada();
</script>
